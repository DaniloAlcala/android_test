version: '3.8'

services:
  android-emulator:
    image: androidsdk/android-30:latest
    container_name: android-test-emu
    ports:
      - "5037:5037"  # ADB port
    environment:
      - ANDROID_SDK_ROOT=/opt/android-sdk-linux
      - ANDROID_HOME=/opt/android-sdk-linux
    volumes:
      - android-data:/root/.android
      - ./qa-automation:/workspace/qa-automation
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: >
      bash -c "
      adb start-server &&
      echo '✓ ADB Server iniciado' &&
      sleep infinity
      "

volumes:
  android-data:
    driver: local
