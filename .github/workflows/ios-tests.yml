name: iOS Tests (Phase 4)

on:
  push:
  pull_request:

jobs:
  ios-tests:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Verify Maestro
        run: maestro --version

      - name: Set up iOS Simulator
        run: |
          # Get available iPhone runtime
          RUNTIME=$(xcrun simctl list runtimes | grep 'iOS' | tail -1 | awk '{print $NF}')
          DEVICE_TYPE="com.apple.CoreSimulator.SimDeviceType.iPhone-15"
          
          # Create and boot simulator
          SIM_ID=$(xcrun simctl create "QA Test iPhone" "$DEVICE_TYPE" "$RUNTIME")
          xcrun simctl boot "$SIM_ID"
          
          # Wait for boot
          xcrun simctl bootstatus "$SIM_ID" -b
          echo "Simulator booted: $SIM_ID"

      - name: Run iOS Tests
        run: |
          # Ensure simulator is ready
          xcrun simctl list devices
          
          # Run Maestro tests
          bash qa-automation/scripts/run-tests.sh

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-logs
          path: qa-automation/reports/

      - name: Test Report Summary
        if: always()
        run: |
          echo "## 🍎 iOS Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "qa-automation/reports" ]; then
            echo "✅ Reports available in artifacts" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ No test reports found" >> $GITHUB_STEP_SUMMARY
          fi
